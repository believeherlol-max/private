<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Complete</title>
    <style>
        body { 
            background-color: #0f0f13; 
            color: #e0e0e6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding-top: 25vh; 
        }
        h2 { color: #5865F2; margin-bottom: 10px; }
        p { color: #b9bbbe; }
    </style>
</head>
<body>
    <h2 id="title">Verifying your account...</h2>
    <p id="status">Please wait while we complete your authentication.</p>

    <script>
        // Grab the 'code' parameter from the root URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            document.getElementById('title').innerText = "Verification Successful!";
            document.getElementById('status').innerText = "You have successfully authorized the application. You can now close this tab.";
            
            // Optional: You can send this code to a backend or webhook if needed, 
            // but for now, it's safely captured right in the URL on your clean domain!
            console.log("Auth Code Captured:", code);
        } else {
            document.getElementById('title').innerText = "Private Forever";
            document.getElementById('status').innerText = "Secure verification portal is active.";
        }
    </script>
</body>
</html>
