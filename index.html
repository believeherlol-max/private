<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join /taking</title>
    <!-- Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #f3f4f6;
        }
        /* Subtle glow animation for the main title */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.9; text-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }
            50% { opacity: 1; text-shadow: 0 0 35px rgba(255, 255, 255, 0.25); }
        }
        .glow-text {
            animation: pulseGlow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6 selection:bg-neutral-800 selection:text-white">

    <header class="w-full max-w-4xl flex justify-between items-center py-4">
        <div class="text-xs uppercase tracking-widest text-neutral-500 font-medium">
            /taking community
        </div>
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="System Online"></div>
    </header>

    <main class="w-full max-w-2xl flex flex-col items-center justify-center text-center my-auto space-y-8 px-4">
        
        <!-- Main Callout Text -->
        <h1 class="glow-text text-3xl sm:text-5xl md:text-6xl font-light tracking-tight text-neutral-100 leading-tight">
            join <span class="font-normal text-white underline decoration-neutral-700 underline-offset-8">/taking</span> for cute catboys
        </h1>

        <!-- Optional action button for atmosphere -->
        <div class="pt-4">
            <button onclick="copyLink()" class="group relative inline-flex items-center gap-2 px-6 py-3 rounded-full bg-neutral-900 border border-neutral-800 text-neutral-300 hover:text-white hover:border-neutral-700 transition-all duration-300 text-sm font-medium shadow-lg hover:shadow-neutral-900/50 active:scale-95">
                <span>Copy Invite Link</span>
                <svg class="w-4 h-4 text-neutral-500 group-hover:text-neutral-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
            </button>
            <div id="toast" class="opacity-0 transition-opacity duration-300 text-xs text-neutral-500 mt-2">Link copied to clipboard!</div>
        </div>

    </main>

    <footer class="w-full max-w-4xl py-6 flex flex-col items-center justify-center text-center">
        <!-- Tiny disclaimer text -->
        <p class="text-[10px] sm:text-xs text-neutral-600 tracking-wide font-light">
            this website does not include any nsfw
        </p>
    </footer>

    <script>
        // Function to copy text fallback compatible with iframe restrictions
        function copyLink() {
            const textToCopy = "https://discord.gg/taking"; // placeholder invite link or format
            
            // Modern clipboard attempt with fallback
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast();
                }).catch(() => {
                    fallbackCopy(textToCopy);
                });
            } else {
                fallbackCopy(textToCopy);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";  // Avoid scrolling to bottom
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
